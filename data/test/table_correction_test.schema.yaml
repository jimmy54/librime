# Rime schema settings
# encoding: utf-8

schema:
  schema_id: table_correction_test
  name: "Table Correction Test"
  version: "0.1"

engine:
  processors:
    - recognizer
    - key_binder
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " "

translator:
  dictionary: table_correction_test
  enable_completion: false
  enable_sentence: false
  enable_encoder: false
  enable_user_dict: false
  enable_correction: false
